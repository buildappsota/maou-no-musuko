<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one screen with no page scroll. Wide: stage + party on the left, the phase panel on the right. Tall: stage, party, then the panel. */
:root {
  color-scheme: dark;
  --bg: #120e1d;
  --panel: #1c1730;
  --panel2: #2a2247;
  --line: #43396e;
  --ink: #f2ecff;
  --dim: #a99fc8;
  --gold: #e8c15a;
  --gold-ink: #241a05;
  --red: #e2574c;
  --green: #6fd08c;
  --blue: #6fb0dc;
  --violet: #b085ea;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px;
}
h2 { font-size: 17px; margin: 0; color: var(--gold); letter-spacing: .04em; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.dim { color: var(--dim); font-size: 12px; }
.grow { flex: 1 1 auto; min-width: 0; min-height: 0; }
.row { display: flex; gap: 6px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.center { text-align: center; align-items: center; }
.eyebrow { color: var(--dim); font-size: 11px; letter-spacing: .1em; }

/* one screen, no page scroll: top bar / (stage + party) / panel.
   Wide screens put the panel beside the stage; tall screens put it underneath. */
.app { height: 100%; display: flex; flex-direction: column; gap: 6px; }
.top { flex: none; display: flex; gap: 6px; align-items: center; min-height: 26px; }
.net { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.net::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--dim); }
.net.on::before { background: var(--green); }
.tbtn { font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: var(--gold); }
.main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.left { flex: none; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stage-wrap { display: flex; justify-content: center; }
.stage { position: relative; aspect-ratio: 384 / 216; width: min(100%, calc((100dvh - 410px) * 1.7778)); min-width: 260px; max-width: 100%;
  background: #0a0810; border: 2px solid var(--line); overflow: hidden; container-type: inline-size; }
.panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
/* wide screens and fullscreen: the stage on top, the party plates right under the characters, the command window below */
@media (min-aspect-ratio: 5/4) and (min-width: 760px) {
  .main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; grid-template-areas: "stage" "party" "panel"; }
  .left { display: contents; }
  .stage-wrap { grid-area: stage; min-height: 0; container-type: size; align-items: center; }
  .stage { width: min(100cqw, 100cqh * 1.7778); min-width: 0; }
  .main .party { grid-area: party; }
  .main .panel { grid-area: panel; max-height: 62vh; }
  .main .panel > .box.fill { flex: 0 0 auto; }
  .main .skills { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .main .jobs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.logo { position: absolute; left: 0; right: 0; top: 17%; text-align: center; }
.logo-t { font-size: 11cqw; line-height: 1.05; letter-spacing: .12em; color: var(--gold);
  text-shadow: 0 .06em 0 #6b3a12, .05em 0 0 #2a1408, -.05em 0 0 #2a1408, 0 -.05em 0 #2a1408, 0 .14em .3em rgba(0, 0, 0, .7); }
.logo-s { margin-top: .5em; font-size: 2.4cqw; letter-spacing: .32em; color: var(--ink); text-shadow: 0 2px 0 #000; }
.round { position: absolute; left: 1.5%; top: 2%; font-size: max(10px, 2cqw); color: var(--ink); background: rgba(10, 8, 16, .72); padding: 1px 7px; border: 1px solid var(--line); }
.banner { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 92%; padding: 3px 14px; font-size: max(11px, 2.5cqw); text-align: center;
  background: rgba(10, 8, 16, .82); border: 1px solid var(--gold); color: var(--ink); opacity: 0; transition: opacity .18s; z-index: 3; }
.banner.show { opacity: 1; }
.banner.warn { border-color: var(--red); color: #ffd9d4; background: rgba(60, 10, 12, .88); }
.banner.big { font-size: max(16px, 4.2cqw); color: var(--gold); top: 38%; padding: 6px 26px; }
.eplate { position: absolute; transform: translate(-50%, -100%); width: 13%; min-width: 44px; text-align: center; }
.eplate .en { display: block; font-size: max(9px, 1.8cqw); line-height: 1.2; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; }
.hot { position: absolute; pointer-events: auto; background: transparent; border: 2px dashed rgba(255, 255, 255, 0); cursor: pointer; padding: 0; }
.hot:hover { border-color: rgba(255, 255, 255, .7); }
.hot.sel { border-color: var(--red); border-style: solid; }
.bigtext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6em; text-align: center; padding: 0 6%;
  font-size: max(13px, 3.4cqw); text-shadow: 0 2px 0 #000, 0 0 12px #000; }
.bigtext .rv2 { color: #ff8f85; font-size: 1.35em; }
.bigtext > div { animation: fadein .6s both; }
.bigtext .rv2 { animation-delay: 2.6s; }
.bigtext .rv3 { animation-delay: 4.4s; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rolecard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 8, 16, .72); pointer-events: auto; padding: 3%; font-size: max(11px, 2.2cqw); }
.rolecard .card { max-width: 70%; max-height: 100%; overflow: hidden; }
.rolecard .role-name { font-size: 1.5em; }
.diagbox { position: absolute; right: 1%; top: 2%; margin: 0; padding: 6px 8px; background: rgba(10, 8, 16, .9); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: pre; z-index: 4; }

/* the next enemy, on the stage above the party */
.foe { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); width: 76%; max-height: 52%; display: flex; gap: 2.2cqw; align-items: center;
  padding: 1.3cqw 2cqw; background: rgba(10, 8, 16, .8); border: 2px solid var(--red); font-size: max(9px, 1.9cqw); line-height: 1.35; }
.foe-pic { flex: none; display: flex; align-items: flex-end; }
.foe-art { display: block; height: 20cqw; width: auto; }
.foe-info { min-width: 0; display: flex; flex-direction: column; gap: .25em; }
.foe-eye { color: var(--dim); letter-spacing: .1em; font-size: .9em; }
.foe-name { color: #ff8f85; font-size: 1.6em; line-height: 1.15; }
.foe ul { padding-left: 1.1em; }
.foe-mv { color: var(--dim); }
.foe-key { font-size: 1.15em; line-height: 1.4; padding: .25em .55em; background: rgba(232, 193, 90, .14); border: 1px solid rgba(232, 193, 90, .7); }
.foe-key b { color: var(--gold); font-weight: 700; white-space: nowrap; }
.foe-key b.me { color: #fff1a8; text-decoration: underline; text-underline-offset: .2em; }

/* cut-in before a boss: warning bands slide in, the title punches in, the whole thing fades away */
.cutin { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; z-index: 5;
  animation: ci-out .6s ease-in 4.3s both; }
.ci-band { height: 9%; background: #8a0f1e; color: #ffd0c8; display: flex; align-items: center; overflow: hidden; white-space: nowrap;
  font-size: max(10px, 2.6cqw); letter-spacing: .3em; border-block: 2px solid #ff5a4a; }
.ci-band span { display: inline-block; animation: ci-scroll 6s linear infinite; }
.ci-band.bot span { animation-direction: reverse; }
.ci-band.top { animation: ci-in-l .35s ease-out both; }
.ci-band.bot { animation: ci-in-r .35s ease-out both; }
.ci-mid { text-align: center; padding: 2cqw 4cqw; background: linear-gradient(90deg, transparent, rgba(10, 8, 16, .85) 18%, rgba(10, 8, 16, .85) 82%, transparent);
  animation: ci-punch .5s cubic-bezier(.2, 1.6, .4, 1) 1.5s both; }
.ci-kind { font-size: max(12px, 3cqw); color: #ff8f85; letter-spacing: .35em; }
.ci-name { font-size: max(20px, 7cqw); line-height: 1.1; color: var(--gold); text-shadow: 0 .06em 0 #6b3a12, 0 0 .4em rgba(255, 90, 60, .6); }
.ci-line { margin-top: .5em; font-size: max(11px, 2.2cqw); color: var(--ink); }
.cutin.last .ci-band { background: #2a0f3d; color: #e2c8ff; border-color: #a64dff; }
.cutin.last .ci-name { text-shadow: 0 .06em 0 #3d1c6b, 0 0 .5em rgba(170, 80, 255, .7); }
@keyframes ci-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes ci-in-l { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes ci-in-r { from { transform: translateX(100%); } to { transform: none; } }
@keyframes ci-punch { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: none; } }
@keyframes ci-out { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cutin, .ci-band, .ci-band span, .ci-mid { animation: none; } }
@container (max-width: 520px) { .foe-mv, .foe-eye { display: none; } .foe { width: 92%; } }

.bar { height: 7px; background: #0a0810; border: 1px solid #000; outline: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--green); transition: width .25s; }
.bar.mid i { background: var(--gold); }
.bar.low i { background: var(--red); }

.party { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 1.2%; padding-inline: 4.77%; justify-self: center; align-self: center; margin-inline: auto; max-width: 100%; }
.plate { text-align: center; align-items: stretch; }
.plate .p-name, .plate .chips, .plate .dots { justify-content: center; }
.new-tag { margin-left: .4em; font-size: 9px; color: #0a0810; background: #6fd08c; padding: 0 4px; vertical-align: middle; }
.bigtext .ev2 { color: #ffe9a0; font-size: 1.05em; animation-delay: 3.3s; }
.bigtext .ev2 b { color: #fff; font-weight: 700; }
.bigtext .ev3 { color: var(--dim); font-size: .7em; animation-delay: 3.6s; }
.plate { background: var(--panel); border: 2px solid var(--line); padding: 3px 6px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.chips, .dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 14px; }
.chip { font-size: 10px; padding: 0 5px; border: 1px solid var(--line); background: var(--panel2); white-space: nowrap; }
.chip.pts { border-color: var(--gold); color: var(--gold); }
.chip.ok { border-color: var(--green); color: var(--green); }
.chip.st-poison { color: #b6e86a; } .chip.st-shield, .chip.st-guard, .chip.st-counter { color: var(--blue); } .chip.st-power { color: #ffb066; }
.chip.st-frozen, .chip.st-chill { color: #b0e0f5; } .chip.st-atkdn { color: var(--red); } .chip.st-stealth { color: var(--violet); }
.dot { font-family: var(--mono); font-size: 9px; padding: 0 3px; border: 1px solid var(--line); color: #5d5485; }
.dot.on { color: var(--ink); border-color: var(--blue); background: #22345c; }
.dot.ult.on { border-color: var(--gold); background: #4a3a12; color: var(--gold); }
.dot.rk.on { border-color: var(--violet); background: #3a2260; color: #e7d4ff; }

.box { background: var(--panel); border: 2px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.box.fill { flex: 1 1 auto; min-height: 0; }
.box.center { justify-content: center; }
.head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.time { color: var(--dim); font-size: 12px; }
.timer { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.hot { color: var(--red); }
.lead { font-size: 14px; max-width: 46em; text-wrap: balance; }
.btn { font: inherit; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); padding: 5px 10px; cursor: pointer; text-align: center; min-height: 32px; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn.primary { background: var(--gold); border-color: #fff1b8 #8a6a1f #8a6a1f #fff1b8; color: var(--gold-ink); }
.btn.big { font-size: 16px; padding: 7px 18px; }
.btn.sm { font-size: 12px; padding: 2px 8px; min-height: 26px; }
.btn.sq { min-width: 28px; min-height: 28px; padding: 0; }
.btn:disabled { opacity: .42; cursor: default; }
.btn[aria-pressed="true"]:not(.primary) { border-color: var(--green); color: var(--green); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.field { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
.field input, .field select { font: inherit; color: var(--ink); background: #0f0b1a; border: 2px solid var(--line); padding: 3px 7px; min-width: 0; }
.check { display: flex; gap: 6px; align-items: center; font-size: 12px; }

.how { max-width: 46em; text-align: left; font-size: 12px; color: var(--dim); }
.how summary { cursor: pointer; color: var(--ink); }
.how li { margin: 2px 0; }

.jobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.job { background: var(--panel2); border: 2px solid var(--line); padding: 5px; display: flex; gap: 6px; min-width: 0; }

.slot.empty { opacity: .6; }
button.job { font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
button.job:hover { border-color: var(--gold); }
.job-art { flex: none; width: 46px; height: 58px; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(#2c3e63, #1d2946); overflow: hidden; }
.job-art canvas { width: 46px !important; height: 58px !important; }
.job-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; }
.job-name { color: var(--gold); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.statline { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.big-num { font-size: 26px; color: var(--gold); line-height: 1; font-family: var(--mono); }
.alloc4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.al-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #171228; border: 1px solid var(--line); padding: 3px 2px; min-width: 0; }
.al-nm { font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.al-ctl { display: flex; align-items: center; gap: 2px; }
.al-v { width: 2ch; text-align: center; font-family: var(--mono); font-size: 16px; color: var(--gold); }
.props { display: flex; flex-direction: column; gap: 4px; }
.prop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); padding: 3px 6px; background: #171228; font-size: 12px; }
.prop-by { color: var(--ink); max-width: 7em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prop-al { display: flex; gap: 3px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
.vdots { display: inline-flex; gap: 3px; }
.vdots i { width: 8px; height: 8px; border: 1px solid var(--line); background: #0f0b1a; }
.vdots i.on { background: var(--green); border-color: var(--green); }
.buyrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.buy { font: inherit; color: var(--ink); text-align: left; display: flex; flex-direction: column; gap: 1px; border: 2px solid var(--line); padding: 4px 8px; background: #171228; min-width: 0; cursor: pointer; }
button.buy:hover:not(:disabled) { border-color: var(--gold); }
button.buy:disabled { opacity: .42; cursor: default; }
.buy .sk-name { color: var(--gold); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buy.own { border-color: var(--green); cursor: default; }

.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.skill { font: inherit; text-align: left; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); padding: 4px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.skill:hover:not(:disabled) { border-color: var(--gold); }
.skill.sel { border-color: var(--gold); background: #3a2f5c; box-shadow: inset 0 0 0 1px var(--gold); }
.skill.ult .sk-name { color: var(--gold); } .skill.rank .sk-name { color: #e2c8ff; }
.skill:disabled { opacity: .45; cursor: default; }
.sk-slot { font-size: 10px; color: var(--dim); letter-spacing: .08em; }
.sk-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk-desc { font-size: 10px; color: var(--dim); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.choice { display: flex; flex-direction: column; gap: 1px; text-align: left; }
.choice b { font-weight: 400; color: var(--gold); }
.icon { width: 20px; height: 20px; flex: none; vertical-align: middle; }
.chip.lvq { border-color: var(--gold); color: var(--gold-ink); background: var(--gold); }
.loots { display: flex; flex-direction: column; gap: 6px; }
.loot { border: 1px solid var(--line); background: #171228; padding: 5px 7px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.loot-h { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 13px; }
.loot-h b { font-weight: 400; color: var(--gold); white-space: nowrap; }
.loot-h .dim { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.loot-nm { font-size: 15px; }
.loot-d { color: #ffe9a0; font-size: 13px; background: #2c2210; border: 1px solid #6b5420; padding: 0 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.giveto { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.btn.on { border-color: var(--green); color: var(--green); }
.lvpick { border: 2px solid var(--gold); background: rgba(232, 193, 90, .08); padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
.lvcols { display: grid; grid-template-columns: minmax(0, 2fr) auto minmax(0, 1fr); gap: 8px; align-items: start; }
.lvh { font-size: 12px; color: var(--gold); margin-bottom: 3px; }
.lvor { align-self: center; color: var(--dim); font-size: 12px; }

/* gfx.js — software pixel renderer for 魔王の息子.

   Global: GFX. Colors are '#rrggbb' strings (or PAL entries); 0 / null means transparent (erases). */
(function (root) {
  'use strict';

  var cache = Object.create(null);
  function pack(r, g, b) {
    r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;

  /** Any color form -> packed uint32 (ABGR, alpha 255). 0/null/undefined -> 0 (transparent). */
  function C(v) {

    if (c !== undefined) return c;
    var s = v.charAt(0) === '#' ? v.slice(1) : v;
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];

    c = (0xFF000000 | ((n & 255) << 16) | (n & 0xFF00) | ((n >> 16) & 255)) >>> 0;
    cache[v] = c;
    return c;
  }

  function cb(c) { return (c >> 16) & 255; }

    return pack(cr(d) + cr(c) * a, cg(d) + cg(c) * a, cb(d) + cb(c) * a);
  }
  var WHITE = pack(255, 255, 255), BLACK = pack(0, 0, 0);
